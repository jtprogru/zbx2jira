[project]
name = "zbx2jira"
version = "0.0.4"
description = "Интеграция системы мониторинга Zabbix и системы Jira ServiceDesk."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "JTProgru", email = "mail@jtprog.ru" }]
license = { file = "LICENCE.md" }
dependencies = [
    # Прямые зависимости проекта
    # jira>=3.10.5 больше не тянет Pillow (убран из зависимостей в 3.10.5)
    "jira>=3.10.5",
    "pyzabbix>=1.3.1",
    "python-dotenv>=1.2.2",
    "urllib3>=2.7.0",
    # Нижние границы для транзитивных зависимостей, закрывающие
    # security-алерты Dependabot/Snyk (certifi/cryptography/idna/pyjwt/requests)
    # cryptography>=50.0.0 — GHSA-g6cj-pr64-35w5 (Bleichenbacher-оракул в PKCS#7)
    # pyjwt>=2.13.0 — GHSA-993g-76c3-p5m4 (SSRF в PyJWKClient), GHSA-fhv5-28vv-h8m8 (DoS по kid)
    "certifi>=2026.7.22",
    "cryptography>=50.0.0",
    "idna>=3.18",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/jtprogru/zbx2jira"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]

[tool.uv]
package = false

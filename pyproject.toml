[project]
name = "zbx2jira"
version = "0.0.4"
description = "Интеграция системы мониторинга Zabbix и системы Jira ServiceDesk."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "JTProgru", email = "mail@jtprog.ru" }]
license = { file = "LICENCE.md" }
dependencies = [
    # Прямые зависимости проекта
    # jira>=3.10.5 больше не тянет Pillow (убран из зависимостей в 3.10.5)
    "jira>=3.10.5",
    "pyzabbix>=1.3.1",
    "urllib3>=2.7.0",
    # Нижние границы для транзитивных зависимостей, закрывающие
    # security-алерты Dependabot/Snyk (certifi/cryptography/idna/pyjwt/requests)
    "certifi>=2024.7.4",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "pyjwt>=2.13.0",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/jtprogru/zbx2jira"

[dependency-groups]
dev = [
    "flake8>=7.1.1",
]

[tool.uv]
package = false
